spec_version: 1
name: risk_prediction
version: "1.1.0"
type: space
runtime: fastapi
app: server.app:app
port: 8000

graders:
  - id: small_grader
    entrypoint: task_graders:grade_small
  - id: medium_grader
    entrypoint: task_graders:grade_medium
  - id: hard_grader
    entrypoint: task_graders:grade_hard

tasks:
  - id: small
    grader_id: small_grader
  - id: medium
    grader_id: medium_grader
  - id: hard
    grader_id: hard_grader